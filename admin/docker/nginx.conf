user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    access_log /dev/stdout;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # The final chunk streams the assembled video to EFV before returning.
        location = /admin/efv-gallery/chunk {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_read_timeout 3660s;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 60s;
        }

        # Filament / Livewire 静态资源
        # 关键：try_files 必须 fallback 到 /index.php，因为 Livewire 的
        #   /livewire/livewire.min.js 是动态路由（不是物理文件），
        # 没这个 fallback 浏览器拿不到 Livewire JS，表单会回落到原生 POST → 405。
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
            expires 30d;
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
