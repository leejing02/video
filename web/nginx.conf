server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* 反代到 Go API 容器（同源调用，前端不需要改 baseURL）
    location /api/ {
        proxy_pass             http://api:8000/api/;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        # 关闭缓冲，流式转发响应，避免 ERR_INCOMPLETE_CHUNKED_ENCODING
        proxy_buffering        off;
        proxy_request_buffering off;
    }

    # WebSocket 升级（/ws/chat）
    location /ws/ {
        proxy_pass         http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # /storage 视频静态文件（如果有上传）
    location /storage/ {
        proxy_pass http://api:8000/storage/;
    }

    # 八字命盘分享页：Go 注入 OG meta tags，再由 Vue Router 渲染
    # 这样 WhatsApp/Twitter/Discord 等抓取时能看到正确的预览卡片
    location ~ ^/chart/([^/]+)$ {
        proxy_pass             http://api:8000/chart/$1;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # SPA fallback：所有其他路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
