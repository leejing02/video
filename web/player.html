<!doctype html>
<html lang="zh-CN" class="playback-document">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background-color: #000000; color-scheme: dark; }
    #playback-entry-cover { position: fixed; inset: 0; z-index: 20; background: #000; pointer-events: none; }
    #playback-entry-cover img { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 100%; height: auto; max-height: 100%; object-fit: fill; }
    /* iOS 26 Safari ignores theme-color and tints the status bar from the topmost
       opaque fixed element at the top edge. Without this strip it sampled the video
       frame, so light videos left the status bar white. Only covers the status bar
       area (the back button starts below it). It stays hit-testable on purpose:
       Safari's sampling follows the element that owns the top-centre point. */
    #playback-status-tint { position: fixed; top: 0; left: 0; right: 0; height: max(12px, env(safe-area-inset-top, 0px)); background: #000000; z-index: 2147483647; }
  </style>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>视频平台</title>
</head>
<body>
  <div id="playback-status-tint" aria-hidden="true"></div>
  <script>
    // Paint the clicked cover before module downloads, Vue startup or API requests.
    try {
      const query = new URLSearchParams(location.search)
      const saved = JSON.parse(sessionStorage.getItem('short-playback-feed') || 'null')
      if (saved && saved.id === Number(query.get('id')) && saved.entry === query.get('entry') &&
          !saved.returning && Date.now() - saved.created < 300000 && typeof saved.cover === 'string' &&
          /^(data:image\/|https?:\/\/|\/[^/])/.test(saved.cover)) {
        const layer = document.createElement('div')
        layer.id = 'playback-entry-cover'
        layer.setAttribute('aria-hidden', 'true')
        const image = new Image()
        image.alt = ''
        image.decoding = 'sync'
        image.fetchPriority = 'high'
        image.src = saved.cover
        layer.append(image)
        document.body.append(layer)
        // The player removes this only after its cover or first frame is ready.
      }
    } catch { /* Direct playback and private storage restrictions use the normal loader. */ }
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
